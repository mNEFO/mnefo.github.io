<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP2350 Nixie Clock Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff6b00;
            /* ニキシー管風オレンジ */
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1rem;
            color: #aaa;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .sensor-val {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            margin: 10px 0 0 0;
        }

        .unit {
            font-size: 0.9rem;
            color: #888;
            font-weight: normal;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        label {
            font-size: 0.9rem;
            color: #ccc;
        }

        input[type="range"] {
            width: 100%;
        }

        select {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
        }

        #log-console {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
            border-radius: 6px;
            height: 150px;
            overflow-y: auto;
            font-size: 0.85rem;
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff4444;
            margin-right: 6px;
        }

        .status-dot.connected {
            background-color: #00cc66;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        /* トグルスイッチの台座 */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* スライダー本体 */
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        /* ONの時の色 (ニキシーオレンジ) */
        input:checked+.slider {
            background-color: #ff6b00;
        }

        input:checked+.slider:before {
            transform: translateX(22px);
        }

        /* 無効（未接続）時 */
        input:disabled+.slider {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1><span id="status-dot" class="status-dot"></span>RP2350 Nixie Control</h1>
            <div>
                <button id="btn-connect">時計に接続</button>
                <button id="btn-sync-time" disabled>PC時刻と同期</button>
            </div>
        </header>

        <!-- テレメトリ（センサー情報）表示 -->
        <div class="grid">
            <div class="card">
                <h2>SHT40 温湿度</h2>
                <p class="sensor-val"><span id="val-temp">--.-</span> <span class="unit">°C</span></p>
                <p class="sensor-val"><span id="val-hum">--.-</span> <span class="unit">%</span></p>
            </div>

            <div class="card">
                <h2>LPS22 気圧</h2>
                <p class="sensor-val"><span id="val-press">----.-</span> <span class="unit">hPa</span></p>
            </div>

            <div class="card">
                <h2>環境照度 (L / R)</h2>
                <p class="sensor-val"><span id="val-ls-l">--</span> / <span id="val-ls-r">--</span></p>
            </div>
        </div>
        <div class="grid">
            <div class="card">
                <h2>機能 ON/OFF</h2>
                <div class="control-group">
                    <div class="toggle-row">
                        <span>GPS 自動時刻同期</span>
                        <label class="switch">
                            <input type="checkbox" id="toggle-gps" disabled>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
        <!-- コントロール操作 -->
        <div class="grid">
            <div class="card">
                <h2>表示モード切替</h2>
                <div class="control-group">
                    <select id="select-mode" disabled>
                        <option value="clock">時刻表示</option>
                        <option value="date">日付表示</option>
                        <option value="thp">温度湿度気圧表示</option>
                        <option value="dm">計測モード</option>
                        <option value="test">テストモード</option>
                    </select>
                    <button id="btn-set-mode" disabled>モード変更を送信</button>
                </div>
            </div>

            <div class="card">
                <h2>輝度調整</h2>
                <div class="control-group">
                    <label for="range-brightness">輝度: <span id="val-brightness-disp">20</span></label>
                    <input type="range" id="range-brightness" min="1" max="50" value="20" disabled>
                </div>
            </div>
        </div>

        <!-- システムログ領域 -->
        <div class="card">
            <h2>システムログ</h2>
            <div id="log-console">接続ボタンを押してRP2350を選択してください...<br /></div>
        </div>
        <div class="card">
            <h2>Board ID</h2>
            <p class="sensor-val"><span id="val-board-id">----------------</span></p>
        </div>
    </div>

    <!-- JavaScriptの読み込み -->
    <script src="app.js"></script>
</body>

</html>
